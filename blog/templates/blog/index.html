{% extends 'blog/base.html' %}

{% block titulo %}{% endblock %}

{%block css%}
    
{%endblock%}

{% block contenido %}
    <p>Funciona! </p>
    
    <ul>
        {% for post in posts %}
            <a href="{% url 'detalle' pk=post.pk %}">{{post.titulo}}</a><br>
        {%endfor%}
        <a href="{% url 'autores'%}">Autores</a>
    </ul>

    <h3>Categorias</h3>
  
    <ul>
        {% for categoria in categorias %}
            <a href="{% url 'categorias' pk=categoria.pk%}">{{categoria.nombre}}</a> <br>
        {%endfor%}
    </ul>

{% endblock %}
