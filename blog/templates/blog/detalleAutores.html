{% extends 'blog/base.html' %}

{% block titulo %}AUTOR: {{autor.nombre}} {% endblock %}

{% block contenido %}

    <ul>
        {%for post in autores %}
            <a href="{% url 'detalle' pk=post.pk%} ">{{post.titulo}}</a>
        {%endfor%}
    </ul>

    <a href="{% url 'autores' %}">Volver</a>

{% endblock %}
